# Merge this into your existing n8n compose file (same project / network).
#
# Example .env additions:
#   GAMES_DOMAIN_NAME=games.yourdomain.com
#   CLIENT_ORIGIN=https://games.yourdomain.com
#
# Build from repo root:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.addon.yml build webgames

services:
  webgames:
    build:
      context: ../
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=3000
      - STATIC_DIR=/app/public
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-https://${GAMES_DOMAIN_NAME}}
      - NODE_ENV=production
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Optional: point tunnel at webgames after adding a Public Hostname in Cloudflare
  tunnel:
    depends_on:
      webgames:
        condition: service_healthy
